name: pipeline

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: [master, develop, pre]
  push:
    branches: [master, develop, pre]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: pytest -q

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target env
        id: env
        run: |
          case "${{ github.ref }}" in
            refs/heads/master)
              echo "env=prd" >> $GITHUB_OUTPUT
              echo "branch=master" >> $GITHUB_OUTPUT ;;
            refs/heads/develop)
              echo "env=acc" >> $GITHUB_OUTPUT
              echo "branch=develop" >> $GITHUB_OUTPUT ;;
            refs/heads/pre)
              echo "env=pre" >> $GITHUB_OUTPUT
              echo "branch=pre" >> $GITHUB_OUTPUT ;;
            *)
              echo "Unsupported branch: ${{ github.ref }}" >&2
              exit 1 ;;
          esac

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/stephenadei/bankjes:${{ steps.env.outputs.env }}
            ghcr.io/stephenadei/bankjes:${{ steps.env.outputs.env }}-${{ github.sha }}

      - name: Deploy on VPS
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262  # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/stephen/projects/bankjes-${{ steps.env.outputs.env }}
            # Use the workflow's GITHUB_TOKEN directly in the fetch URL so we
            # bypass whichever gh account happens to be "active" on the VPS.
            git fetch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ${{ steps.env.outputs.branch }}
            git checkout -B ${{ steps.env.outputs.branch }} FETCH_HEAD
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            ./scripts/deploy.sh ${{ steps.env.outputs.env }}

  # Post-deploy QA on acc/pre, then promote (docs/qa.md): acc green → pre; pre green → release PR.
  # Push-only, so fork code never reaches the VPS runner. VPS because herald, the stephenadei gh
  # login and the cached Playwright Chromium live there.
  qa:
    needs: deploy
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/pre')
    runs-on: [self-hosted, vps]
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ENV_NAME: ${{ github.ref == 'refs/heads/develop' && 'acc' || 'pre' }}
      QA_BASE_URL: ${{ github.ref == 'refs/heads/develop' && 'https://bankjes-acc.stephensprive.app' || 'https://bankjes-pre.stephensprive.app' }}
      QA_EXPECT_SHA: ${{ github.sha }}
      QA_ARTIFACTS: qa-artifacts
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # promote.sh merges
          persist-credentials: false  # public repo; pushes use the PAT below, not this token

      - name: Install QA deps
        run: |
          python3 -m venv "$RUNNER_TEMP/qa-venv"
          "$RUNNER_TEMP/qa-venv/bin/pip" install -q -r qa/requirements.txt
          "$RUNNER_TEMP/qa-venv/bin/python" -m playwright install --only-shell chromium
          echo "$RUNNER_TEMP/qa-venv/bin" >> "$GITHUB_PATH"

      - name: QA ${{ env.ENV_NAME }}
        run: pytest qa -q -p no:cacheprovider -W ignore::pytest.PytestConfigWarning

      - name: Summary
        if: always()
        run: cat "$QA_ARTIFACTS/results.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload screenshots
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ env.ENV_NAME }}-${{ github.sha }}
          path: qa-artifacts/
          retention-days: 30

      - name: Promote
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RESULTS: qa-artifacts/results.md
        run: |
          # stephenadei's PAT from the runner's gh login: GITHUB_TOKEN pushes/PRs trigger no workflows.
          GH_TOKEN="$(gh auth token -u stephenadei)" || { echo "::error::no stephenadei gh login on this runner"; exit 1; }
          echo "::add-mask::$GH_TOKEN"
          export GH_TOKEN
          scripts/promote.sh "$ENV_NAME" "$GITHUB_SHA"

      - name: Alert on red
        if: failure()
        run: |
          line="$(head -1 "$QA_ARTIFACTS/results.md" 2>/dev/null | tr -d '*')"
          NOTIFY_CONTEXT=ops.alert herald send "🔴 bankjes $ENV_NAME QA/promotion failed at ${GITHUB_SHA::7}; nothing promoted. ${line:-no QA results}. $RUN_URL"

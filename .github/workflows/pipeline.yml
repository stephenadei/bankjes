name: pipeline

# test, image build and post-deploy QA run on titanium CT110 (runner titanium-bankjes-1); pushes
# publish ghcr.io/stephenadei/bankjes:<env>-<sha> + :<env>, and the VPS deploy runner (gh-deploy,
# label vps-deploy) only pulls. Nothing builds or tests on the VPS.
# Spec: myworkspace docs/specs/active/2026-11-08-ci-app-separation.md (step 4).

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: [master, develop, pre]
  push:
    branches: [master, develop, pre]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  # PUBLIC repo + self-hosted runner: never run fork PR code on our runners.
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, titanium]
    steps:
      - uses: actions/checkout@v4

      # setup-python has no prebuilt 3.12 for the titanium runner's OS; uv brings a standalone one.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          activate-environment: true

      - name: Install deps
        run: uv pip install -r requirements.txt pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest -q

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: [self-hosted, titanium]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      env: ${{ steps.env.outputs.env }}
    env:
      IMAGE: ghcr.io/stephenadei/bankjes
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target env
        id: env
        run: |
          case "$GITHUB_REF" in
            refs/heads/master)  echo "env=prd" >> "$GITHUB_OUTPUT" ;;
            refs/heads/develop) echo "env=acc" >> "$GITHUB_OUTPUT" ;;
            refs/heads/pre)     echo "env=pre" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported branch: $GITHUB_REF" >&2; exit 1 ;;
          esac

      - name: Build image
        env:
          ENV_NAME: ${{ steps.env.outputs.env }}
        run: |
          start=$(date +%s)
          docker build \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t "$IMAGE:$ENV_NAME-$GITHUB_SHA" -t "$IMAGE:$ENV_NAME" .
          echo "docker build: $(( $(date +%s) - start ))s on $RUNNER_NAME" | tee -a "$GITHUB_STEP_SUMMARY"

      # Login in a throwaway DOCKER_CONFIG, never the runner user's ~/.docker/config.json.
      - name: Push to GHCR
        env:
          ENV_NAME: ${{ steps.env.outputs.env }}
          DOCKER_CONFIG: ${{ runner.temp }}/docker-ghcr
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$ENV_NAME-$GITHUB_SHA"
          docker push "$IMAGE:$ENV_NAME"

  # Runner user gh-deploy has no docker group and no access to ~stephen; its only power is
  # `sudo -u stephen deploy-bankjes <env> <sha>` (myworkspace scripts/deploy/deploy-bankjes: pull,
  # up --no-build, /healthz must report <sha>, rollback + herald ops.alert on failure).
  deploy:
    needs: build
    runs-on: vps-deploy
    timeout-minutes: 15
    permissions:
      packages: read
    steps:
      - name: Deploy (pull tagged image, no build)
        env:
          ENV_NAME: ${{ needs.build.outputs.env }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | sudo -n -u stephen /home/stephen/scripts/deploy/deploy-bankjes "$ENV_NAME" "$GITHUB_SHA"

  # Post-deploy QA on acc/pre, then promote (docs/qa.md): acc green → pre; pre green → release PR.
  # Push-only, so fork code never reaches a self-hosted runner. Runs in the Playwright image
  # (Chromium + its system libs; the titanium runner has no sudo to install them).
  qa:
    needs: [build, deploy]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/pre'
    runs-on: [self-hosted, titanium]
    container: mcr.microsoft.com/playwright/python:v1.58.0-noble  # = qa/requirements.txt playwright
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ENV_NAME: ${{ needs.build.outputs.env }}
      QA_BASE_URL: ${{ github.ref == 'refs/heads/develop' && 'https://bankjes-acc.stephensprive.app' || 'https://bankjes-pre.stephensprive.app' }}
      QA_EXPECT_SHA: ${{ github.sha }}
      QA_ARTIFACTS: qa-artifacts
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Install gh
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends gh >/dev/null

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # promote.sh merges
          persist-credentials: false  # public repo; pushes use the PAT below, not this token

      - name: Install QA deps
        run: pip install -q --break-system-packages -r qa/requirements.txt

      - name: QA ${{ env.ENV_NAME }}
        run: pytest qa -q -p no:cacheprovider -W ignore::pytest.PytestConfigWarning

      - name: Summary
        if: always()
        run: cat "$QA_ARTIFACTS/results.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload screenshots
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ env.ENV_NAME }}-${{ github.sha }}
          path: qa-artifacts/
          retention-days: 30

      # stephenadei's classic PAT (repo scope): GITHUB_TOKEN pushes/PRs trigger no workflows.
      - name: Promote
        env:
          GH_TOKEN: ${{ secrets.BANKJES_PROMOTE_TOKEN }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RESULTS: qa-artifacts/results.md
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::secret BANKJES_PROMOTE_TOKEN missing"; exit 1; }
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/promote.sh "$ENV_NAME" "$GITHUB_SHA"

  # herald lives on the VPS only: the deploy runner posts the red-QA alert through deploy-bankjes.
  qa-alert:
    needs: [build, qa]
    if: always() && needs.qa.result == 'failure'
    runs-on: vps-deploy
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Alert on red
        env:
          ENV_NAME: ${{ needs.build.outputs.env }}
        run: sudo -n -u stephen /home/stephen/scripts/deploy/deploy-bankjes "$ENV_NAME" qa-red "$GITHUB_SHA" "$GITHUB_RUN_ID" </dev/null

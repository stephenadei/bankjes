name: pipeline

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: [master, develop, pre]
  push:
    branches: [master, develop, pre]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  # PUBLIC repo + self-hosted runner: never run fork PR code on the VPS.
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, vps]
    steps:
      - uses: actions/checkout@v4

      # System python3 (3.12) + per-job venv; no tool cache needed on the runner.
      - name: Install deps
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q -r requirements.txt pytest pytest-asyncio
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: pytest -q

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: [self-hosted, vps]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target env
        id: env
        run: |
          case "${{ github.ref }}" in
            refs/heads/master)
              echo "env=prd" >> "$GITHUB_OUTPUT"
              echo "branch=master" >> "$GITHUB_OUTPUT" ;;
            refs/heads/develop)
              echo "env=acc" >> "$GITHUB_OUTPUT"
              echo "branch=develop" >> "$GITHUB_OUTPUT" ;;
            refs/heads/pre)
              echo "env=pre" >> "$GITHUB_OUTPUT"
              echo "branch=pre" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Unsupported branch: ${{ github.ref }}" >&2
              exit 1 ;;
          esac

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/stephenadei/bankjes:${{ steps.env.outputs.env }}
            ghcr.io/stephenadei/bankjes:${{ steps.env.outputs.env }}-${{ github.sha }}

      - name: Deploy on VPS
        # Runs on the VPS runner itself (user stephen): same commands the SSH hop ran.
        env:
          ENV_NAME: ${{ steps.env.outputs.env }}
          BRANCH: ${{ steps.env.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          cd "/home/stephen/projects/bankjes-$ENV_NAME"
          # Use the workflow's GITHUB_TOKEN directly in the fetch URL so we
          # bypass whichever gh account happens to be "active" on the VPS.
          git fetch "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$BRANCH"
          git checkout -B "$BRANCH" FETCH_HEAD
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          ./scripts/deploy.sh "$ENV_NAME"

  # Post-deploy QA on acc/pre, then promote (docs/qa.md): acc green → pre; pre green → release PR.
  # Push-only, so fork code never reaches the VPS runner. VPS because herald, the stephenadei gh
  # login and the cached Playwright Chromium live there.
  qa:
    needs: deploy
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/pre')
    runs-on: [self-hosted, vps]
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ENV_NAME: ${{ github.ref == 'refs/heads/develop' && 'acc' || 'pre' }}
      QA_BASE_URL: ${{ github.ref == 'refs/heads/develop' && 'https://bankjes-acc.stephensprive.app' || 'https://bankjes-pre.stephensprive.app' }}
      QA_EXPECT_SHA: ${{ github.sha }}
      QA_ARTIFACTS: qa-artifacts
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # promote.sh merges
          persist-credentials: false  # public repo; pushes use the PAT below, not this token

      - name: Install QA deps
        run: |
          python3 -m venv "$RUNNER_TEMP/qa-venv"
          "$RUNNER_TEMP/qa-venv/bin/pip" install -q -r qa/requirements.txt
          "$RUNNER_TEMP/qa-venv/bin/python" -m playwright install --only-shell chromium
          echo "$RUNNER_TEMP/qa-venv/bin" >> "$GITHUB_PATH"

      - name: QA ${{ env.ENV_NAME }}
        run: pytest qa -q -p no:cacheprovider -W ignore::pytest.PytestConfigWarning

      - name: Summary
        if: always()
        run: cat "$QA_ARTIFACTS/results.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload screenshots
        id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: qa-${{ env.ENV_NAME }}-${{ github.sha }}
          path: qa-artifacts/
          retention-days: 30

      - name: Promote
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RESULTS: qa-artifacts/results.md
        run: |
          # stephenadei's PAT from the runner's gh login: GITHUB_TOKEN pushes/PRs trigger no workflows.
          GH_TOKEN="$(gh auth token -u stephenadei)" || { echo "::error::no stephenadei gh login on this runner"; exit 1; }
          echo "::add-mask::$GH_TOKEN"
          export GH_TOKEN
          scripts/promote.sh "$ENV_NAME" "$GITHUB_SHA"

      - name: Alert on red
        if: failure()
        run: |
          line="$(head -1 "$QA_ARTIFACTS/results.md" 2>/dev/null | tr -d '*')"
          NOTIFY_CONTEXT=ops.alert herald send "🔴 bankjes $ENV_NAME QA/promotion failed at ${GITHUB_SHA::7}; nothing promoted. ${line:-no QA results}. $RUN_URL"

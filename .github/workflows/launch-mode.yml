name: launch-mode

# Toggle bankjes-<env> between coming-soon (prelaunch) and the real app (live): flips APP_ENV in
# .env.<env> on the VPS and recreates the container with the image already there (no pull).
# Runner user gh-deploy can only `sudo -u stephen deploy-bankjes <env> prelaunch|live`
# (myworkspace scripts/deploy/deploy-bankjes).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Public visibility on bankjes.stephenadei.nl"
        type: choice
        options:
          - prelaunch
          - live
        required: true
      env:
        description: "Target deploy env (almost always prd)"
        type: choice
        options:
          - prd
          - acc
          - pre
        default: prd

jobs:
  toggle:
    runs-on: vps-deploy
    permissions: {}
    steps:
      - name: Edit env + recreate container
        env:
          TARGET_ENV: ${{ inputs.env }}
          MODE: ${{ inputs.mode }}
        run: sudo -n -u stephen /home/stephen/scripts/deploy/deploy-bankjes "$TARGET_ENV" "$MODE" </dev/null
